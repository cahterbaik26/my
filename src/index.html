<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koneksi Terputus - Web2App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }
    .icon {
      width: 64px;
      height: 64px;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #f1f5f9;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .details {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 12px;
      color: #cbd5e1;
      text-align: left;
      margin-bottom: 24px;
      word-break: break-all;
    }
    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #8b5cf6;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #7c3aed;
    }
    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
    .btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1 id="app-title">Gagal Memuat Halaman Website</h1>
    <p>Aplikasi tidak dapat menghubungi server situs web target. Pastikan komputer Anda terhubung ke internet atau situs web sedang aktif.</p>
    
    <div class="details" id="error-details">
      <div><strong>Target:</strong> <span id="target-url">-</span></div>
      <div><strong>Kode Kesalahan:</strong> <span id="error-code">-</span></div>
      <div><strong>Keterangan:</strong> <span id="error-desc">-</span></div>
    </div>

    <div class="button-group">
      <button class="btn-primary" onclick="retry()">Coba Muat Ulang</button>
      <button class="btn-secondary" onclick="window.location.reload()">Refresh Diagnostik</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const target = params.get('target') || 'URL Website';
    const code = params.get('code') || 'ERR_CONNECTION_REFUSED';
    const desc = params.get('desc') || 'Koneksi ke alamat website terputus atau ditolak';
    const app = params.get('app');

    if (app) {
      document.getElementById('app-title').textContent = `${app} Tidak Dapat Terhubung`;
    }
    document.getElementById('target-url').textContent = target;
    document.getElementById('error-code').textContent = code;
    document.getElementById('error-desc').textContent = desc;

    function retry() {
      if (window.web2app && window.web2app.retryLoad) {
        window.web2app.retryLoad();
      } else {
        window.location.href = target;
      }
    }
  </script>
</body>
</html>
