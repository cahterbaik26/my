name: Build Desktop Application (All Platforms - Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      project_config_path:
        description: 'Path ke file konfigurasi proyek'
        required: false
        default: 'app-config.json'
      output_formats:
        description: 'Format output yang diminta'
        required: false
        default: 'exe,dmg,zip'
      application_version:
        description: 'Versi aplikasi yang akan dibuild'
        required: false
        default: '1.0.0'

permissions:
  contents: read
  actions: read

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows (.exe NSIS)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Configuration File
        shell: bash
        run: |
          CONFIG_FILE="${{ github.event.inputs.project_config_path || 'app-config.json' }}"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: Configuration file $CONFIG_FILE not found!"
            exit 1
          fi
          echo "Configuration file $CONFIG_FILE verified."

      - name: Compile TypeScript
        run: npm run build:ts

      - name: Build Electron Package (NSIS EXE)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64

      - name: Verify Generated Windows Binaries
        shell: bash
        run: |
          echo "Verifying generated Windows binaries..."
          ls -lh release/*.exe 2>/dev/null || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-v${{ github.event.inputs.application_version || '1.0.0' }}
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: warn
          retention-days: 14

  build-macos:
    name: Build macOS (.dmg & .zip)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Configuration File
        run: |
          CONFIG_FILE="${{ github.event.inputs.project_config_path || 'app-config.json' }}"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Error: Configuration file $CONFIG_FILE not found!"
            exit 1
          fi
          echo "Configuration file $CONFIG_FILE verified."

      - name: Compile TypeScript
        run: npm run build:ts

      - name: Build macOS Application (DMG and ZIP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --mac dmg zip --universal

      - name: Verify Generated macOS Binaries
        run: |
          echo "Verifying generated macOS binaries..."
          mkdir -p release
          ls -lh release/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-application-v${{ github.event.inputs.application_version || '1.0.0' }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.pkg
          if-no-files-found: warn
          retention-days: 14
